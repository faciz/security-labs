name: Link Check

on:
  push:
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
      - ".lycheeignore"
      - "lychee.toml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
      - ".lycheeignore"
      - "lychee.toml"
  schedule:
    # Weekly run to catch links that rot over time
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress './**/*.md'
          fail: true
