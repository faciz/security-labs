[project]
name = "vaultbank-lab"
version = "2.0.0"
description = "A local, deliberately vulnerable AI banking security lab"
requires-python = ">=3.11,<3.14"
dependencies = [
    "azure-identity>=1.19.0,<2",
    "flask>=3.0.3,<4",
    "httpx>=0.27.2,<1",
    "openai>=1.55.3,<3",
    "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
redteam = ["azure-ai-evaluation[redteam]==1.18.3"]

[dependency-groups]
dev = [
    "djlint>=1.36,<2",
    "ipykernel>=6,<8",
    "ipywidgets>=8,<9",
    "playwright>=1.50,<2",
    "pytest>=8,<10",
    "pytest-mock>=3,<4",
    "ruff>=0.11,<1",
    "shellcheck-py>=0.10,<0.12",
    "tqdm>=4,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["vaultbot", "part2-red-teaming"]
testpaths = ["tests"]
addopts = "-m 'not browser'"
markers = ["browser: opt-in Chromium end-to-end tests"]

[tool.ruff]
target-version = "py311"
line-length = 79

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
